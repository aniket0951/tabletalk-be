name: Deploy to Hostinger VPS

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type 'deploy' to confirm"
        required: true
        type: string

permissions:
  contents: read

jobs:
  confirm:
    name: Confirm Intent
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        if: ${{ inputs.confirm_deploy != 'deploy' }}
        run: |
          echo "Deployment not confirmed. You must type 'deploy' to proceed."
          exit 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: confirm

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tabletalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tabletalk_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tabletalk_test

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npx vitest run --reporter=verbose
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tabletalk_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tabletalk_test
          JWT_SECRET: test-secret-key
          STAFF_JWT_SECRET: test-staff-secret-key

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          SHA_TAG="${{ secrets.DOCKERHUB_USERNAME }}/tabletalk-be:${{ github.sha }}"
          LATEST_TAG="${{ secrets.DOCKERHUB_USERNAME }}/tabletalk-be:latest"
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production

    steps:
      - name: Setup SSH agent
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval $(ssh-agent -s)
          echo "$SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: SSH and deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/tabletalk && docker compose pull api && docker compose up -d --force-recreate api && docker image prune -f"

      - name: Deployment Summary
        run: |
          echo "## Hostinger Deployment Successful"
          echo "- **Commit:** ${{ github.sha }}"
          echo "- **Triggered by:** ${{ github.actor }}"
          echo "- **Deployed at:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
